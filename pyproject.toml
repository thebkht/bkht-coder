[project]
name = "bkht-coder"
dynamic = ["version"]
description = "A coding agent that runs on a model server you control -- nothing leaves the machine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bakhtiyor Ganijon" }]
keywords = ["coding-agent", "ollama", "mlx", "llm", "cli", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/thebkht/bkht-coder"
Repository = "https://github.com/thebkht/bkht-coder"
Issues = "https://github.com/thebkht/bkht-coder/issues"

[project.scripts]
coder = "bkht.coder.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Training only. Kept out of the runtime dependencies deliberately: the shipped
# agent depends on httpx and nothing else, and the machine that trains a model
# is not the machine that has to run one.
train = ["mlx-lm>=0.21"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The git tag is the only place a version number is written. A build from an
# untagged commit describes itself as a dev version of the release it is heading
# for, so a checkout can never claim to be a release it is not.
[tool.hatch.version]
source = "vcs"
# A tarball or a clone without tags has nothing to describe. Degrading is
# better than failing the build, and 0.0.0 is the honest floor: it sorts below
# every real release, so such a build is told to update -- which is the right
# advice for a copy that cannot say what it is.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "bkht/coder/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["bkht"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "live: requires a reachable model server, and is deselected by default",
]
# The live tests drive a real model, and they are not slightly slower -- a bare
# `pytest` that collects them takes 46 minutes against 9 seconds without them,
# and 45 of those minutes are five tests. A suite nobody can afford to run
# before a commit is a suite that stops being run, so the default is the fast
# arm and the slow one is asked for: `pytest -m live`. Nothing is skipped
# silently -- pytest reports the deselected count on every run.
addopts = ["-m", "not live"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set, pinned so a ruff upgrade cannot silently widen CI.
select = ["E4", "E7", "E9", "F"]
