name: Review

# Off by default, and deliberately fenced in. Both reasons are about the runner.
#
# Review needs a reachable Ollama and a ~9 GB model, so it cannot run on a
# hosted runner -- the same reason ci.yml excludes the `live` suite. And a
# self-hosted runner is not ephemeral: whatever runs on it runs on the machine
# itself, and stays there.
#
# That matters because `pull_request` checks out the pull request's own code,
# which `uv sync` and `coder review` then execute. From a fork that is a
# stranger's code running on your hardware -- and a label is not a gate, because
# `synchronize` re-runs on every later push while the label stays put. So the
# job additionally requires the branch to live in this repository, which takes
# write access to create.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: coder review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'coder-review'))
    runs-on: [self-hosted, ollama]
    steps:
      # --base resolves a merge base, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      # --ci is detected from GITHUB_ACTIONS anyway; it is spelled out here so
      # the annotations are not a surprise to whoever reads this file next.
      - name: Review
        run: uv run coder review --base "origin/${{ github.base_ref || github.event.repository.default_branch }}" --ci
